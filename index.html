<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고성 육상대회 경기일정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root {
  --bg: #f5f2ec;
  --surface: #ffffff;
  --surface-2: #f6f3ee;
  --ink: #18202e;
  --ink-2: #4b5363;
  --ink-3: #7d8390;
  --line: #e6e0d6;
  --line-strong: #d4ccbf;
  --hero: #c4472b;
  --track: #c4472b;
  --track-soft: #fbeae4;
  --heat: #2f5d9e;
  --heat-soft: #e7eef8;
  --warn-ink: #8a5300;
  --warn-bg: #fff4d9;
  --mark: #ffe27a;
  --ok: #1d7a4a;
  --ok-soft: #e2f3e8;
  --gold: #855a00;
  --gold-soft: #fff0c2;
  --shadow: 0 10px 30px -16px rgba(24, 32, 46, .35);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519;
    --surface: #1b1f26;
    --surface-2: #232832;
    --ink: #eef0f4;
    --ink-2: #b9bec8;
    --ink-3: #8b919c;
    --line: #2d333e;
    --line-strong: #3b4250;
    --hero: #8f321e;
    --track: #e8684a;
    --track-soft: #3a221c;
    --heat: #94b6ec;
    --heat-soft: #1f2b40;
    --warn-ink: #f2c56d;
    --warn-bg: #33280f;
    --mark: #6d5a10;
    --ok: #6fd39f;
    --ok-soft: #16342a;
    --gold: #f3c74f;
    --gold-soft: #3b300f;
    --shadow: 0 10px 30px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519;
  --surface: #1b1f26;
  --surface-2: #232832;
  --ink: #eef0f4;
  --ink-2: #b9bec8;
  --ink-3: #8b919c;
  --line: #2d333e;
  --line-strong: #3b4250;
  --hero: #8f321e;
  --track: #e8684a;
  --track-soft: #3a221c;
  --heat: #94b6ec;
  --heat-soft: #1f2b40;
  --warn-ink: #f2c56d;
  --warn-bg: #33280f;
  --mark: #6d5a10;
  --ok: #6fd39f;
  --ok-soft: #16342a;
  --gold: #f3c74f;
  --gold-soft: #3b300f;
  --shadow: 0 10px 30px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; }
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-variant-numeric: tabular-nums; }

/* ---------- 머리말 ---------- */
.hero { position: relative; background: var(--hero); color: #fff; overflow: hidden; }
.hero-inner { padding-block: 32px 72px; }
.eyebrow { margin: 0 0 4px; font-size: 14px; font-weight: 500; opacity: .88; }
.hero h1 { margin: 0; font-size: clamp(28px, 6.4vw, 46px); font-weight: 900; line-height: 1.15; letter-spacing: -.02em; }
.hero-meta { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; opacity: .92; }
.hero-meta b { font-weight: 700; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 20px 0 0; }
.stats dt { font-size: 12px; opacity: .8; }
.stats dd { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stats dd small { font-size: 14px; font-weight: 500; margin-left: 2px; }
.lanes {
  position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
  background: repeating-linear-gradient(to bottom, transparent 0 10px, rgba(255, 255, 255, .45) 10px 11px);
}

/* ---------- 검색·필터 ---------- */
.panel {
  position: relative; z-index: 1; margin-top: -30px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; box-shadow: var(--shadow);
}
.search {
  display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 14px;
  background: var(--surface-2); border: 1.5px solid var(--line-strong); border-radius: 12px; color: var(--ink-3);
}
.search:focus-within { border-color: var(--track); background: var(--surface); }
.search input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  font: inherit; font-size: 17px; color: var(--ink);
}
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
.icon-btn {
  flex: none; display: grid; place-items: center; width: 36px; height: 36px;
  border: 0; border-radius: 8px; background: transparent; color: var(--ink-3); cursor: pointer;
}
.icon-btn:hover { background: var(--line); color: var(--ink); }
.search-help { margin: 8px 2px 0; font-size: 13px; color: var(--ink-3); }
.filter-row { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; }
.filter-label { flex: none; width: 30px; padding-top: 7px; font-size: 13px; font-weight: 700; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip {
  display: inline-flex; align-items: baseline; gap: 5px; padding: 6px 12px;
  border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface);
  color: var(--ink-2); font-size: 14px; font-weight: 500; cursor: pointer;
}
.chip small { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .72; }

/* ---------- 결과 막대 ---------- */
.resultbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  margin-top: 8px; padding: 12px 0;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 15px; min-width: 0; }
.summary b { font-size: 18px; font-variant-numeric: tabular-nums; }
.sum-filter { color: var(--ink-3); font-size: 14px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--track); font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.actions { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.btn-primary, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 700;
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn-primary { border: 0; background: var(--track); color: #fff; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--heat); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 14px 0 0; font-size: 13px; color: var(--ink-3); }
.legend span.sep { width: 1px; height: 12px; background: var(--line-strong); }

/* ---------- 라운드 배지 ---------- */
.badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; line-height: 1.5; white-space: nowrap; }
.badge.heat { background: var(--heat-soft); color: var(--heat); }
.badge.final { background: var(--track); color: #fff; }
.badge.cond { padding: 1px 7px; border: 1px dashed var(--track); color: var(--track); }

mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ---------- 경기 결과 ---------- */
.badge.out { background: var(--surface-2); color: var(--ink-3); }
.res { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; }
.res > span { padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.res .rs-rank.top { background: var(--gold-soft); color: var(--gold); }
.res .rs-rec { padding-inline: 2px; background: transparent; color: var(--ink); }
.res .rs-adv { background: var(--ok-soft); color: var(--ok); }
.res .rs-adv.no, .res .rs-st { color: var(--ink-3); }
.live { display: flex; align-items: center; gap: 7px; margin: 8px 0 0; font-size: 13px; color: var(--ink-3); }
.live i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: live 2s infinite; }
.live.err i { background: var(--track); animation: none; }
@keyframes live { 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: reduce) { .live i { animation: none; } }

/* ---------- 결과 입력 (관리자, 주소 끝 ?admin) ---------- */
.admin-bar { padding-top: env(safe-area-inset-top, 0px); background: var(--ink); color: var(--bg); }
.admin-bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; font-size: 14px; }
.ab-msg { flex: 1 1 220px; min-width: 0; }
.ab-user { font-size: 13px; opacity: .75; }
.admin-bar .btn { padding: 7px 12px; }
.ab-list { flex-basis: 100%; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px dashed color-mix(in srgb, currentColor 35%, transparent); }
.ab-list ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ab-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ab-list p { margin: 0; font-size: 13px; opacity: .75; }
.ab-add { display: flex; gap: 8px; }
.ab-add input { flex: 1; min-width: 0; height: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; }
.can-edit [data-row] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.can-edit .slots li[data-row] { margin: -4px -8px; padding: 4px 8px; border-radius: 8px; }
.can-edit .slots li[data-row]:hover, .can-edit .slots li[data-row]:active { background: var(--surface-2); }
.can-edit .person[data-row] { box-shadow: inset 0 0 0 1px var(--line-strong); }
.can-edit .person[data-row]:hover, .can-edit .person[data-row]:active { background: var(--line); }
.ed .modal-card { width: min(480px, 100%); }
.ed-body { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 16px; padding: 16px 18px; }
.ed-what { margin: 0; font-size: 14px; color: var(--ink-2); }
.ed-field { display: flex; flex-direction: column; gap: 8px; }
.ed-label { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.ed-ranks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.ed-opts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.ed-ranks button, .ed-opts button {
  height: 44px; padding: 0; border: 1px solid var(--line-strong); border-radius: 10px;
  background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer;
}
.ed-opts button { font-size: 15px; font-weight: 500; }
.ed-ranks button[aria-pressed="true"], .ed-opts button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
#edAdv button[data-v="y"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.ed-input {
  width: 100%; height: 48px; padding: 0 14px; border: 1.5px solid var(--line-strong); border-radius: 10px;
  background: var(--surface-2); color: var(--ink); font: inherit; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.ed-input:focus { outline: 0; border-color: var(--track); background: var(--surface); }
.ed-input::placeholder { color: var(--ink-3); font-size: 15px; font-weight: 400; }
.ed-meta { margin: 0; font-size: 12px; color: var(--ink-3); }
@media (max-width: 600px) { .modal.ed { align-items: flex-start; } }

/* ---------- 학생별 ---------- */
.group { margin-top: 24px; }
.group-title { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; font-size: 19px; font-weight: 900; }
.group-title span { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.name { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
.sub { margin: 2px 0 0; font-size: 13px; color: var(--ink-3); }
.pill { flex: none; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 500; }
.day { display: grid; grid-template-columns: 50px 1fr; gap: 10px; padding-top: 10px; border-top: 1px dashed var(--line-strong); }
.day-label { display: flex; flex-direction: column; line-height: 1.25; }
.day-label b { font-size: 16px; font-variant-numeric: tabular-nums; }
.day-label span { font-size: 12px; color: var(--ink-3); }
.slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.slots li { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 8px; }
.slots li .res { grid-column: 2 / -1; margin-top: -2px; }
.slots li.dim, .person.dim { opacity: .55; }
.time { font-weight: 700; font-variant-numeric: tabular-nums; }
.event { font-weight: 500; }
.note { display: flex; gap: 6px; align-items: flex-start; margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; font-weight: 500; }
.note svg { flex: none; margin-top: 2px; }

/* ---------- 시간순 ---------- */
.day-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 10px; font-size: 21px; font-weight: 900; }
.day-title .dow { font-size: 15px; font-weight: 700; color: var(--ink-2); }
.lvl { align-self: center; padding: 2px 8px; border-radius: 999px; background: var(--track-soft); color: var(--track); font-size: 12px; font-weight: 700; }
.day-title .cnt { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.timeline { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.tl-row { display: grid; grid-template-columns: 68px 1fr; border-top: 1px solid var(--line); }
.tl-row:first-child { border-top: 0; }
.tl-row.same { border-top-style: dashed; }
.tl-row.same .tl-time { visibility: hidden; }
.tl-time { padding: 12px 0 12px 16px; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tl-body { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 12px 0; min-width: 0; }
.tl-what { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.tl-what .event { font-size: 16px; font-weight: 700; }
.tl-what .meta { font-size: 13px; color: var(--ink-3); }
.tl-who { display: flex; flex-wrap: wrap; gap: 6px; }
.person { display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); font-size: 14px; font-weight: 500; }
.person small { font-size: 12px; font-weight: 400; color: var(--ink-3); }
.person .res { margin-left: 2px; font-size: 12px; }
@media (min-width: 760px) {
  .tl-row { grid-template-columns: 84px 1fr; }
  .tl-time { padding-left: 20px; }
  .tl-body { display: grid; grid-template-columns: 260px 1fr; align-items: start; column-gap: 16px; }
  .tl-body .note { grid-column: 2; }
}

.empty { margin-top: 24px; padding: 48px 16px; text-align: center; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 14px; color: var(--ink-2); }
.empty p { margin: 0 0 12px; }

.foot { margin-top: 32px; padding-bottom: 40px; font-size: 13px; color: var(--ink-3); }
.foot p { margin: 4px 0; }

/* ---------- 이미지 미리보기 ---------- */
.modal {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  background: rgba(10, 12, 18, .62);
}
.modal[hidden] { display: none; }
.modal-card { display: flex; flex-direction: column; width: min(760px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); background: var(--surface); border-radius: 16px; overflow: hidden; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px 10px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 16px; }
.modal-body { flex: 1; overflow: auto; padding: 16px; background: var(--surface-2); }
.modal-body img { display: block; width: 100%; height: auto; border-radius: 6px; box-shadow: 0 2px 12px rgba(0, 0, 0, .18); }
.modal-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
.modal-foot p { margin: 0; font-size: 13px; color: var(--ink-3); }
.modal-actions { display: flex; gap: 8px; margin-left: auto; }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
  padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg);
  font-size: 14px; font-weight: 500; box-shadow: var(--shadow);
}

/* ---------- 내보내기용 시트 (항상 밝은 색) ---------- */
#sheetHost { position: absolute; left: -10000px; top: 0; pointer-events: none; }
.sheet {
  --ink: #18202e; --ink-2: #4b5363; --ink-3: #7d8390; --line: #e6e0d6; --line-strong: #d4ccbf;
  --surface-2: #f6f3ee; --track: #c4472b; --track-soft: #fbeae4; --heat: #2f5d9e; --heat-soft: #e7eef8;
  --warn-ink: #8a5300; --warn-bg: #fff4d9;
  width: 760px; background: #fff; color: var(--ink);
  font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  font-size: 14px; line-height: 1.5; word-break: keep-all;
}
.sh-head { background: #c4472b; color: #fff; padding: 26px 32px 0; }
.sh-eyebrow { font-size: 14px; font-weight: 500; opacity: .9; }
.sh-title { margin-top: 2px; font-size: 30px; font-weight: 900; line-height: 1.2; letter-spacing: -.02em; }
.sh-title span { margin-left: 6px; font-size: 18px; font-weight: 700; opacity: .85; }
.sh-sub { display: flex; justify-content: space-between; gap: 16px; margin-top: 10px; font-size: 15px; }
.sh-sub b { font-weight: 700; white-space: nowrap; }
.sh-lanes { margin-top: 16px; padding-bottom: 8px; }
.sh-lanes i { display: block; height: 8px; border-bottom: 1px solid rgba(255, 255, 255, .5); }
.sh-body { padding: 8px 32px 4px; }
.sh-school { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 10px; font-size: 18px; font-weight: 900; }
.sh-school span { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.sh-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sh-grid.one { grid-template-columns: 1fr; }
.sh-card { padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; }
.sh-card-head { display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }

<script>
(() => {
  const DATA = JSON.parse(document.getElementById('schedule-data').textContent);
  const DOW_FULL = { 일: '일요일', 월: '월요일', 화: '화요일', 수: '수요일', 목: '목요일', 금: '금요일', 토: '토요일' };
  const ICON_WARN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>';

  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const uniq = (arr) => [...new Set(arr)];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s).toLowerCase().replace(/×/g, 'x').replace(/\s+/g, '');
  function groupBy(arr, keyFn) {
    const m = new Map();
    for (const x of arr) {
      const k = keyFn(x);
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(x);
    }
    return [...m];
  }

  // 경기 결과를 찾는 열쇠. 계주는 팀 하나로 묶고, '결승(진출 시)'도 '결승'으로 봐서
  // 엑셀의 라운드 표기(조 번호, 진출 시)가 바뀌어도 입력한 결과가 그대로 이어지게 합니다.
  const isRelay = (event) => /R$/.test(event);
  const resKey = (r, stage) => (isRelay(r.event)
    ? [r.school, r.gender, r.event, stage]
    : [r.school, r.grade, r.name, r.event, stage]).join('|');

  // 엑셀 한 행: [학교, 학년, 성별, 성명, 종목, 일자, 시간, 라운드, 비고]
  const rows = DATA.rows.map((r, i) => {
    const [school, grade, gender, name, event, dateRaw, time, round, note] = r.map((v) => (v == null ? '' : v));
    const m = String(dateRaw).match(/(\d+)\.\s*(\d+)\.\s*\((.)\)/) || [];
    const month = +m[1], day = +m[2], dow = m[3] || '';
    const t = String(time).padStart(5, '0');
    const row = {
      i, school: String(school), grade: +grade, gender: String(gender), name: String(name), event: String(event),
      time: t, round: String(round), note: String(note), month, day, dow,
      dateKey: `${pad(month)}-${pad(day)}`,
      sortKey: `${pad(month)}-${pad(day)} ${t}`,
      sid: `${school}|${grade}|${name}`,
      level: /중$/.test(school) ? '중등부' : '초등부',
    };
    row.key = resKey(row, row.round.startsWith('예선') ? '예선' : '결승');
    row.heatKey = resKey(row, '예선');
    return row;
  });

  const SCHOOLS = uniq(rows.map((r) => r.school));
  const NAMES = uniq(rows.map((r) => r.name));
  const EVENTS = uniq(rows.map((r) => r.event));
  const DATES = groupBy([...rows].sort((a, b) => a.dateKey.localeCompare(b.dateKey)), (r) => r.dateKey).map(([key, rs]) => ({
    key, short: `${rs[0].month}.${rs[0].day}(${rs[0].dow})`, levels: uniq(rs.map((r) => r.level)),
  }));
  const dateByKey = Object.fromEntries(DATES.map((d) => [d.key, d]));

  // 학교별 바로가기 링크(#gansung 등)에 쓰는 이름표. 목록에 없는 학교는 school-순번.
  const SCHOOL_TOKENS = { 간성초: 'gansung', 도학초: 'dohak', 공현진초: 'gonghyeonjin', 오호초: 'oho', 천진초: 'cheonjin', 고성중: 'goseong' };
  const tokenOf = (s) => SCHOOL_TOKENS[s] || `school-${SCHOOLS.indexOf(s) + 1}`;

  const state = { q: '', school: '', date: '', view: 'student' };

  /* ---------- 검색 ---------- */
  // 학교·학년·종목으로만 해석되는 낱말은 서로 AND, 같은 종류끼리는 OR.
  // 이름(또는 애매한 낱말)끼리는 OR → "김민정 박수빈"은 두 사람, "간성초 김민정"은 간성초의 김민정.
  function parseQuery(q) {
    const g = { school: [], grade: [], event: [], any: [], raw: [] };
    for (const word of q.split(/[\s,，·/]+/)) {
      const t = norm(word);
      if (!t) continue;
      const gm = t.match(/^([1-6])학년$/);
      if (gm) { g.grade.push(+gm[1]); continue; }
      g.raw.push(word);
      const inSchool = SCHOOLS.some((s) => norm(s).includes(t));
      const inName = NAMES.some((n) => norm(n).includes(t));
      const inEvent = EVENTS.some((e) => norm(e).includes(t));
      if (inSchool && !inName && !inEvent) g.school.push(t);
      else if (inEvent && !inName && !inSchool) g.event.push(t);
      else g.any.push(t);
    }
    return g;
  }
  function matches(r, g) {
    if (g.school.length && !g.school.some((t) => norm(r.school).includes(t))) return false;
    if (g.grade.length && !g.grade.includes(r.grade)) return false;
    if (g.event.length && !g.event.some((t) => norm(r.event).includes(t))) return false;
    if (g.any.length && !g.any.some((t) => norm(r.name).includes(t) || norm(r.school).includes(t) || norm(r.event).includes(t))) return false;
    return true;
  }
  function highlighter(g) {
    const words = g.raw.filter(Boolean).sort((a, b) => b.length - a.length).map((w) => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!words.length) return esc;
    const re = new RegExp(words.join('|'), 'gi');
    return (text) => esc(text).replace(re, (m) => `<mark>${m}</mark>`);
  }
  function currentList() {
    const g = parseQuery(state.q);
    return rows.filter((r) =>
      (!state.school || r.school === state.school) &&
      (!state.date || r.dateKey === state.date) &&
      matches(r, g));
  }

  /* ---------- 묶기 ---------- */
  const bySort = (a, b) => a.sortKey.localeCompare(b.sortKey) || a.i - b.i;
  function groupStudents(list) {
    return groupBy(list, (r) => r.sid).map(([sid, rs]) => {
      const sorted = [...rs].sort(bySort);
      const f = sorted[0];
      return {
        sid, school: f.school, grade: f.grade, gender: f.gender, name: f.name, rows: sorted,
        events: uniq(sorted.map((r) => r.event)),
        notes: uniq(sorted.map((r) => r.note).filter(Boolean)),
        days: groupBy(sorted, (r) => r.dateKey),
      };
    });
  }
  function groupDays(list) {
    return groupBy([...list].sort(bySort), (r) => r.dateKey).map(([key, rs]) => ({
      key, first: rs[0], count: rs.length,
      students: uniq(rs.map((r) => r.sid)).length,
      levels: uniq(rs.map((r) => r.level)),
      slots: groupBy(rs, (r) => [r.time, r.event, r.round, r.grade, r.gender].join('|')).map(([, items]) => ({ r: items[0], items })),
    }));
  }
  function slotNotes(items) {
    return groupBy(items.filter((x) => x.note), (x) => x.note).map(([note, xs]) => ({ who: xs.map((x) => x.name).join(', '), note }));
  }

  /* ---------- 화면 그리기 ---------- */
  const roundKind = (round) => (round.startsWith('예선') ? 'heat' : round.includes('진출') ? 'cond' : 'final');
  const badge = (round) => `<span class="badge ${roundKind(round)}">${esc(round)}</span>`;

  /* ---------- 경기 결과 ---------- */
  // RESULTS[열쇠] = { rank, record, adv(true 결승 진출 · false 미진출), status(기권·실격·불참), by, at }
  let RESULTS = {};
  const resOf = (r) => RESULTS[r.key];
  // '결승(진출 시)' 줄은 같은 종목 예선 결과의 진출 여부를 따릅니다.
  const advOf = (r) => (roundKind(r.round) === 'cond' ? (RESULTS[r.heatKey] || {}).adv : undefined);
  function roundBadge(r) {
    const adv = advOf(r);
    if (adv === true) return '<span class="badge final">결승 진출</span>';
    if (adv === false) return '<span class="badge out">미진출</span>';
    return badge(r.round);
  }
  function resParts(r) {
    const v = resOf(r);
    if (!v) return [];
    return [
      v.status && ['rs-st', v.status],
      v.rank && [v.rank <= 3 ? 'rs-rank top' : 'rs-rank', `${v.rank}위`],
      v.record && ['rs-rec', /뛰기|던지기/.test(r.event) && /^\d+(\.\d+)?$/.test(v.record) ? `${v.record}m` : v.record],
      v.adv === true && ['rs-adv', '결승 진출'],
      v.adv === false && ['rs-adv no', '미진출'],
    ].filter(Boolean);
  }
  function resHtml(r) {
    const parts = resParts(r);
    return parts.length ? `<span class="res">${parts.map(([cls, text]) => `<span class="${cls}">${esc(text)}</span>`).join('')}</span>` : '';
  }
  // 이미지·인쇄용 짧은 글자: "1위 · 12.34"
  function resPlain(r) {
    const text = resParts(r).map(([, t]) => t).join(' · ');
    return text ? `<span class="rp">${esc(text)}</span>` : '';
  }
  // 관리자가 로그인하면 일정 줄과 이름표를 눌러 결과를 입력할 수 있게 합니다.
  function rowAttrs(r, cls = '') {
    const c = [cls, advOf(r) === false && 'dim'].filter(Boolean).join(' ');
    return (c ? ` class="${c}"` : '') + (admin.ok ? ` data-row="${r.i}" role="button" tabindex="0"` : '');
  }

  function studentView(list, hl) {
    const students = groupStudents(list);
    return groupBy(students, (s) => s.school).map(([school, ss]) => `
      <section class="group">
        <h2 class="group-title">${hl(school)}<span>${ss.length}명</span></h2>
        <div class="grid">${ss.map((s) => `
          <article class="card">
            <header class="card-head">
              <div>
                <h3 class="name">${hl(s.name)}</h3>
                <p class="sub">${hl(s.school)} · ${s.grade}학년 · ${esc(s.gender)}</p>
              </div>
              <span class="pill">${s.events.length}종목</span>
            </header>

  /* ---------- 인쇄: A4 쪽 나누기 ---------- */
  // 학교(학생별) 또는 날짜(시간순)를 한 묶음으로 보고, 남은 자리에 안 들어가면 새 쪽에서 시작합니다.
  // 한 쪽을 넘는 묶음은 이어지는 칸에 "계속" 제목을 붙여 나눕니다.
  function make(tag, cls, html) {

        return { wrap, box: table.tBodies[0] };
      },
      items: d.slots.map(({ r, items }) => make('tr', '', `
        <td class="t">${r.time}</td>
        <td class="e">${esc(r.event)}<small>${r.grade}학년 ${esc(r.gender)}</small></td>

  function newPrintPage(nCols, meta) {
    const page = make('section', 'pp', `
      <header class="pp-head">
        <div><div class="pp-eyebrow">2026 교육감기 학년별 육상대회</div><div class="pp-title">고성 경기일정<span>${meta.view}</span></div></div>
        <div class="pp-meta">${esc(meta.filter)}<b>${meta.count}</b></div>
      </header>
      <div class="pp-body">${'<div class="pp-col"></div>'.repeat(nCols)}</div>
      <footer class="pp-foot"><span>${meta.note}</span><span>${meta.stamp} 출력 · <b class="pp-no"></b></span></footer>`);
    return { page, cols: [...page.querySelectorAll('.pp-col')] };
  }
  const usedHeight = (col) => {
    const last = col.lastElementChild;
    return last ? last.offsetTop + last.offsetHeight : 0;
  };

  function preparePrint() {
    const host = $('#printHost');
    host.replaceChildren();
    const list = currentList();
    if (!list.length) return;
    const isTime = state.view === 'time';
    const groups = isTime ? timeGroups(list) : studentGroups(list);
    const nCols = isTime ? 1 : 2;
    const now = new Date();
    const parts = filterParts();
    const meta = {
      view: isTime ? '시간순' : '학생별',
      filter: parts.length ? parts.join(' · ') : '전체 일정',
      count: `학생 ${uniq(list.map((r) => r.sid)).length}명 · 일정 ${list.length}건`,
      note: DATA.note ? `※ ${esc(DATA.note)}` : '',
      stamp: `${now.getFullYear()}. ${now.getMonth() + 1}. ${now.getDate()}. ${pad(now.getHours())}:${pad(now.getMinutes())}`,
    };

    // 묶음마다 한 칸에 쌓았을 때의 높이를 먼저 잽니다.
    const probe = newPrintPage(nCols, meta);
    host.appendChild(probe.page);
    for (const g of groups) {
      const { wrap, box } = g.start(false);
      probe.cols[0].appendChild(wrap);
      g.items.forEach((it) => box.appendChild(it));
      g.height = wrap.offsetHeight;
      wrap.remove();
    }
    probe.page.remove();

    const pages = [];
    let cur, ci, col;
    const addPage = () => {
      cur = newPrintPage(nCols, meta);
      host.appendChild(cur.page);
      pages.push(cur);
      ci = 0;
      col = cur.cols[0];
    };
    const nextCol = () => {
      if (ci + 1 < cur.cols.length) col = cur.cols[++ci];
      else addPage();
    };
    const fits = () => usedHeight(col) <= col.clientHeight - 3;
    const pageEmpty = () => cur.cols.every((c) => !c.childElementCount);
    const spaceLeft = () => cur.cols.slice(ci).reduce((sum, c) => sum + Math.max(0, c.clientHeight - usedHeight(c)), 0);

    addPage();
    const pageCap = cur.cols.reduce((sum, c) => sum + c.clientHeight, 0);
    for (const g of groups) {
      if (!pageEmpty()) {
        const left = spaceLeft();
        // 남은 자리에 안 들어가면 새 쪽으로. 한 쪽을 넘는 큰 묶음은 남은 자리가 넉넉할 때만 이어서 씁니다.
        if (g.height * 1.08 > left && (g.height <= pageCap * 0.95 || left < pageCap * 0.4)) addPage();
        // 한 칸에 다 들어가는 묶음은 칸 중간에서 나뉘지 않게 다음 칸에서 시작합니다.
        else if (col.childElementCount && g.height <= col.clientHeight && g.height + 16 > col.clientHeight - usedHeight(col)) nextCol();
      }
      let wrap = null;
      let box = null;
      g.items.forEach((item, i) => {
        if (!box) {
          ({ wrap, box } = g.start(i > 0));
          col.appendChild(wrap);
        }
        box.appendChild(item);
        if (fits() || (col.firstElementChild === wrap && box.childElementCount === 1)) return;
        item.remove();
        if (!box.childElementCount) wrap.remove();
        nextCol();
        ({ wrap, box } = g.start(i > 0));
        col.appendChild(wrap);
        box.appendChild(item);
      });
    }
    pages.forEach((p, i) => { p.page.querySelector('.pp-no').textContent = `${i + 1} / ${pages.length}쪽`; });
  }

  let toastTimer = 0;
  function toast(msg) {

  // claude.ai에 올린 페이지에서는 downloads 기능으로 저장하고, 내 PC에서 연 파일은 일반 다운로드를 씁니다.
  const inViewer = !!(window.claude && window.claude.use);
  const downloadsReady = inViewer ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);

  let previewUrl = null;
  let previewBlob = null;
  let previewName = '';
  async function exportImage() {
    const list = currentList();
    if (!list.length) return;
    if (!window.html2canvas) {
      toast('이미지 저장 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.');
      return;
    }
    const btn = $('#exportBtn');
    const label = btn.querySelector('span');
    btn.disabled = true;
    label.textContent = '만드는 중…';
    const host = $('#sheetHost');
    try {
      const sheet = buildSheet(list);
      host.replaceChildren(sheet);
      await loadFonts(sheet.textContent);
      const w = sheet.offsetWidth, h = sheet.offsetHeight;
      const scale = Math.min(2, Math.sqrt(15e6 / (w * h)));  // 휴대폰 캔버스 한도 안쪽으로
      const canvas = await window.html2canvas(sheet, { scale, backgroundColor: '#ffffff', logging: false });
      const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
      if (!blob) throw new Error('toBlob failed');
      openPreview(blob, fileName());
    } catch (err) {
      console.error(err);
      toast('이미지를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.');
    } finally {
      host.replaceChildren();
      btn.disabled = false;
      label.textContent = '이미지 저장';
    }
  }

  function openPreview(blob, name) {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(blob);
    previewBlob = blob;
    previewName = name;
    $('#preview').src = previewUrl;
    const save = $('#saveBtn');
    save.hidden = false;
    $('#modal').hidden = false;
    document.body.style.overflow = 'hidden';
    save.focus();
    // 저장 기능이 없는 화면이면 버튼을 숨기고 길게 눌러 저장하는 안내만 남깁니다.
    downloadsReady.then((d) => { if (inViewer && !d) save.hidden = true; });
  }
  async function savePreview() {
    if (!previewBlob) return;
    if (!inViewer) {
      const a = document.createElement('a');
      a.href = previewUrl;
      a.download = previewName;
      a.click();
      return;
    }
    try {
      const downloads = await downloadsReady;
      if (!downloads) throw { code: 'unavailable' };
      await downloads.save({ filename: previewName, data: previewBlob });
      toast('이미지를 저장했어요.');
    } catch (err) {
      if (err && err.code === 'declined') return;
      if (err && err.code === 'rate_limited') toast('저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요.');
      else toast('이 화면에서는 파일로 저장할 수 없어요. 이미지를 길게 누르거나 마우스 오른쪽 버튼으로 저장해 주세요.');
    }
  }
  function closePreview() {
    $('#modal').hidden = true;
    document.body.style.overflow = '';
    $('#exportBtn').focus();
  }

      console.error(err);
      live = 'error';
      admin.error = '결과 입력 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
      renderLive();
      renderAdmin();
      return;
    }
    fb.fs.onSnapshot(fb.ref, (snap) => {
      const d = snap.data({ serverTimestamps: 'estimate' }) || {};
      RESULTS = d.r || {};
      resultsAt = d.updatedAt ? d.updatedAt.toDate() : null;
      live = 'on';
      render();
    }, (err) => {
      console.error(err);
      live = 'error';
      renderLive();
    });
    if (ADMIN) startAdmin();
  }

  function renderLive() {
    const el = $('#live');
    el.hidden = !live;
    el.classList.toggle('err', live === 'error');
    const n = Object.keys(RESULTS).length;
    const at = resultsAt ? ` · ${pad(resultsAt.getHours())}:${pad(resultsAt.getMinutes())} 갱신` : '';
    el.innerHTML = live === 'error' ? '<i></i>경기 결과를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.'
      : n ? `<i></i>경기 결과 실시간 반영 중 · ${n}건${at}`
      : '<i></i>경기 결과가 입력되면 이 화면에 바로 나타나요.';
  }

  /* ---------- 결과 입력 (관리자) ---------- */
  // 주소 끝에 ?admin 을 붙여 열고 구글 계정으로 로그인합니다. 카카오톡 같은 앱 안 브라우저는 구글 로그인을 막습니다.
  const IN_KAKAO = /KAKAOTALK/i.test(navigator.userAgent);
  const IN_APP = IN_KAKAO || /NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|BAND\//i.test(navigator.userAgent);

  async function startAdmin() {
    try {
      fb.au = await import(FB_URL('auth'));
    } catch (err) {
      console.error(err);
      admin.error = '로그인 기능을 불러오지 못했어요. 새로고침해 주세요.';
      renderAdmin();
      return;
    }
    fb.auth = fb.au.getAuth(fb.app);
    fb.auth.languageCode = 'ko';
    fb.au.onAuthStateChanged(fb.auth, async (user) => {
      Object.assign(admin, { user, ok: false, list: [], error: '' });
      // 관리자 목록은 관리자만 읽을 수 있으므로, 읽히면 입력 권한이 있는 계정입니다.
      if (user) {
        try {
          admin.list = await loadAdmins();
          admin.ok = true;
        } catch (err) {
          if (err.code !== 'permission-denied') {
            console.error(err);
            admin.error = '입력 권한을 확인하지 못했어요. 새로고침해 주세요.';
          }
        }
      }
      admin.ready = true;
      document.body.classList.toggle('can-edit', admin.ok);
      renderAdmin();
      render();
    });
  }
  async function loadAdmins() {
    const snap = await fb.fs.getDocs(fb.fs.collection(fb.db, 'admins'));
    return snap.docs.map((d) => d.id).sort();
  }
  async function signIn() {
    const { au, auth } = fb;
    const provider = new au.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      await au.signInWithPopup(auth, provider);
    } catch (err) {
      if (err.code === 'auth/popup-blocked') return au.signInWithRedirect(auth, provider);
      if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
      console.error(err);
      toast(err.code === 'auth/operation-not-allowed' ? 'Firebase에서 구글 로그인이 아직 꺼져 있어요.'
        : err.code === 'auth/unauthorized-domain' ? '이 주소는 Firebase 승인된 도메인에 아직 없어요.'
        : '로그인하지 못했어요. 잠시 뒤 다시 해 주세요.');
    }
  }

  function renderAdmin() {
    const bar = $('#adminBar');
    bar.hidden = !ADMIN;
    if (!ADMIN) return;
    const u = admin.user;
    let html;
    if (admin.error) {
      html = `<span class="ab-msg">${esc(admin.error)}</span>`;
    } else if (IN_APP && !u) {
      html = '<span class="ab-msg"><b>앱 안의 브라우저에서는 구글 로그인이 막혀 있어요.</b> Safari나 Chrome으로 열어 주세요.</span>' +
        (IN_KAKAO ? '<button type="button" class="btn" data-admin="external">다른 브라우저로 열기</button>' : '');
    } else if (!admin.ready) {
      html = '<span class="ab-msg">결과 입력 기능을 준비하는 중…</span>';
    } else if (!u) {
      html = '<span class="ab-msg"><b>결과 입력</b> · 관리자 구글 계정으로 로그인해 주세요.</span><button type="button" class="btn" data-admin="login">Google 로그인</button>';
    } else if (!admin.ok) {
      html = `<span class="ab-msg"><b>${esc(u.email)}</b> 계정에는 입력 권한이 없어요.</span><button type="button" class="btn" data-admin="login">다른 계정으로</button>`;
    } else {
      html = `<span class="ab-msg"><b>결과 입력 중</b> · 이름이나 일정을 누르면 입력 창이 열려요.</span>
        <span class="ab-user">${esc(u.email)}</span>
        <button type="button" class="btn" data-admin="admins" aria-expanded="${admin.showList}">관리자</button>
        <button type="button" class="btn" data-admin="logout">로그아웃</button>`;
      if (admin.showList) html += `
        <div class="ab-list">
          <p>여기 추가한 구글 계정도 결과를 입력할 수 있어요. 추가·삭제는 처음 관리자만 할 수 있어요.</p>
          <ul>${admin.list.map((e) => `<li><span>${esc(e)}</span><button type="button" class="btn" data-del="${esc(e)}">삭제</button></li>`).join('')}</ul>
          <form class="ab-add"><input type="email" required placeholder="추가할 구글 계정 이메일" aria-label="추가할 관리자 이메일" autocomplete="off"><button type="submit" class="btn">추가</button></form>
        </div>`;
    }
    bar.querySelector('.wrap').innerHTML = html;
  }
  async function editAdmins(op) {
    try {
      await op();
      admin.list = await loadAdmins();
      renderAdmin();
    } catch (err) {
      console.error(err);
      toast(err.code === 'permission-denied' ? '관리자 추가·삭제는 처음 관리자만 할 수 있어요.' : '바꾸지 못했어요. 잠시 뒤 다시 해 주세요.');
    }
  }

  let editing = null;
  const recordHint = (event) => (/뛰기|던지기/.test(event) ? '예: 3.45 (m)' : /^(800|1500|3000)m$|4×400/.test(event) ? '예: 2:41.30' : '예: 13.45');
  const pressed = (group, v) => group.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  const pressedValue = (group) => { const b = group.querySelector('[aria-pressed="true"]'); return b ? b.dataset.v : ''; };

  function openEditor(r) {
    const v = resOf(r) || {};
    editing = { r, heat: r.round.startsWith('예선') };
    const who = isRelay(r.event)
      ? `팀 ${uniq(rows.filter((x) => x.key === r.key).map((x) => x.name)).join(', ')}`
      : `${r.school} ${r.grade}학년 ${r.gender}`;
    $('#edTitle').textContent = isRelay(r.event) ? `${r.school} ${r.event}` : r.name;
    $('#edWhat').textContent = `${r.event} ${r.round} · ${r.month}.${r.day}(${r.dow}) ${r.time} · ${who}`;
    $('#edRank').value = v.rank || '';
    pressed($('#edRanks'), String(v.rank || ''));
    $('#edRecord').value = v.record || '';
    $('#edRecord').placeholder = recordHint(r.event);
    $('#edAdvRow').hidden = !editing.heat;
    pressed($('#edAdv'), v.adv === true ? 'y' : v.adv === false ? 'n' : '');
    pressed($('#edStatus'), v.status || '');
    const at = v.at && v.at.toDate ? v.at.toDate() : null;
    $('#edMeta').textContent = v.by ? `마지막 입력 ${v.by}${at ? ` · ${pad(at.getHours())}:${pad(at.getMinutes())}` : ''}` : '';
    $('#edClear').hidden = !resOf(r);
    $('#editor').hidden = false;
    document.body.style.overflow = 'hidden';
    $('#edForm').focus();
  }
  function closeEditor() {
    $('#editor').hidden = true;
    document.body.style.overflow = '';
    editing = null;
  }
  function saveEditor(e) {
    e.preventDefault();
    if (!editing) return;
    const { r, heat } = editing;
    const rank = parseInt($('#edRank').value, 10);
    const record = $('#edRecord').value.trim();
    const adv = heat ? pressedValue($('#edAdv')) : '';
    const status = pressedValue($('#edStatus'));
    const v = {};
    if (rank > 0) v.rank = rank;
    if (record) v.record = record;
    if (adv) v.adv = adv === 'y';
    if (status) v.status = status;
    closeEditor();
    writeResult(r.key, Object.keys(v).length ? v : null);
  }
  async function writeResult(key, v) {
    const { fs, ref } = fb;
    toast('저장하는 중…');
    try {
      // 이 학생(계주는 팀) 칸만 바꾸고 다른 결과는 건드리지 않습니다.
      await fs.setDoc(ref,
        { r: { [key]: v ? { ...v, by: admin.user.email, at: fs.serverTimestamp() } : fs.deleteField() }, updatedAt: fs.serverTimestamp() },
        { mergeFields: [new fs.FieldPath('r', key), 'updatedAt'] });
      toast(v ? '저장했어요.' : '결과를 지웠어요.');
    } catch (err) {
      console.error(err);
      toast(err.code === 'permission-denied' ? '입력 권한이 없는 계정이에요.' : '저장하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.');
    }
  }

  /* ---------- 이벤트 ---------- */
  function reset() {
    Object.assign(state, { q: '', school: '', date: '' });
    $('#q').value = '';
    render();
  }
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  $('#clearQ').addEventListener('click', () => { state.q = ''; $('#q').value = ''; render(); $('#q').focus(); });
  $('#schoolChips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (b) { state.school = b.dataset.school; render(); }
  });
  $('#dateChips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (b) { state.date = b.dataset.date; render(); }
  });
  document.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) { state.view = b.dataset.view; render(); }
  });
  document.addEventListener('click', (e) => { if (e.target.closest('[data-reset]')) reset(); });
  $('#exportBtn').addEventListener('click', exportImage);

  // 인쇄 버튼과 Ctrl+P 모두 지금 걸러진 일정표를 인쇄합니다. claude.ai 화면은 인쇄 창을 막아 버튼을 숨깁니다.
  $('#printBtn').hidden = inViewer;
  let printPrepared = false;
  $('#printBtn').addEventListener('click', async () => {
    const btn = $('#printBtn');
    btn.disabled = true;
    preparePrint();
    await loadFonts($('#printHost').textContent);  // 글꼴을 다 받은 뒤 다시 재야 쪽 나눔이 정확합니다
    preparePrint();
    printPrepared = true;
    btn.disabled = false;
    window.print();
  });
  window.addEventListener('beforeprint', () => { if (!printPrepared) preparePrint(); });
  window.addEventListener('afterprint', () => { printPrepared = false; });
  $('#saveBtn').addEventListener('click', savePreview);
  $('#modal').addEventListener('click', (e) => { if (e.target === e.currentTarget || e.target.closest('[data-close]')) closePreview(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('#editor').hidden) closeEditor();
    else if (!$('#modal').hidden) closePreview();
  });
  window.addEventListener('hashchange', () => { readHash(); render(); });

  // 결과 입력: 일정 줄·이름표를 누르면 입력 창, 창 바깥을 눌러도 닫히지 않게 해 입력 중 실수로 사라지지 않게 합니다.
  $('#results').addEventListener('click', (e) => {
    const el = admin.ok && e.target.closest('[data-row]');
    if (el) openEditor(rows[+el.dataset.row]);
  });
  $('#results').addEventListener('keydown', (e) => {
    const el = admin.ok && (e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-row]');
    if (el) { e.preventDefault(); openEditor(rows[+el.dataset.row]); }
  });
  $('#editor').addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeEditor(); });
  $('#edForm').addEventListener('submit', saveEditor);
  $('#edRanks').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const v = $('#edRank').value === b.dataset.v ? '' : b.dataset.v;
    $('#edRank').value = v;
    pressed($('#edRanks'), v);
  });
  $('#edRank').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
    pressed($('#edRanks'), e.target.value);
  });
  ['#edAdv', '#edStatus'].forEach((sel) => $(sel).addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) pressed($(sel), b.dataset.v);
  }));
  $('#edClear').addEventListener('click', () => {
    if (!editing || !confirm('이 결과를 지울까요?')) return;
    const { r } = editing;
    closeEditor();
    writeResult(r.key, null);
  });
  $('#adminBar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-admin], [data-del]');
    if (!b) return;
    const act = b.dataset.admin;
    if (act === 'login') signIn();
    else if (act === 'logout') fb.au.signOut(fb.auth);
    else if (act === 'external') location.href = `kakaotalk://web/openExternal?url=${encodeURIComponent(location.href)}`;
    else if (act === 'admins') { admin.showList = !admin.showList; renderAdmin(); }
    else if (b.dataset.del && confirm(`${b.dataset.del} 계정을 관리자에서 뺄까요?`)) {
      editAdmins(() => fb.fs.deleteDoc(fb.fs.doc(fb.db, 'admins', b.dataset.del)));
    }
  });
  $('#adminBar').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = e.target.querySelector('input').value.trim().toLowerCase();
    if (email) editAdmins(() => fb.fs.setDoc(fb.fs.doc(fb.db, 'admins', email), { addedBy: admin.user.email, at: fb.fs.serverTimestamp() }));
  });

  if (ADMIN) {
    // 관리자는 대개 그날 경기를 시간순으로 보며 입력합니다.
    const now = new Date();
    const today = `${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    state.view = 'time';
    if (dateByKey[today]) state.date = today;
  }

  document.documentElement.lang = 'ko';
  setupStatic();
  readHash();
  render();
  renderAdmin();
  startResults();
})();
</script>
</body>
</html>
