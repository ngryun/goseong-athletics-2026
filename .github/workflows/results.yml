name: 공식 경기 결과 갱신

# GitHub 예약 실행은 크게 늦거나 빠지는 일이 잦아서(11/5에는 10분 간격 예약 중 두 번만 돌았음),
# 한 번 시작된 실행이 대회 기간 내내 5분마다 공식 기록을 확인하고, 작업 시간 한도(6시간) 전에
# 다음 실행을 스스로 띄워 이어 갑니다. 예약 실행은 그 사슬이 끊겼을 때 다시 잇는 예비용입니다.
on:
  schedule:
    - cron: "17 * 4-7 11 *"   # 매시 17분(UTC 11/4~11/7). 돌고 있는 실행이 있으면 기다리다 취소됩니다.
  workflow_dispatch:          # Actions 탭에서 수동 실행 = 돌고 있는 실행을 끝내고 새로 시작
    inputs:
      all:
        description: "이미 받은 결과까지 전부 다시 읽기"
        type: boolean
        default: false
      handoff:
        description: "(자동으로 이어 붙일 때 쓰는 값 — 손대지 않아도 됩니다)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # 다음 실행 띄우기

concurrency:
  group: results
  # 손으로 실행하면 돌던 실행을 끝내고 바로 시작. 이어 붙인 실행·예약 실행은 앞 실행이 끝나길 기다립니다.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.handoff }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 5분마다 공식 기록 확인 → 바뀌면 커밋 (GitHub Pages가 자동으로 다시 배포)
        env:
          GH_TOKEN: ${{ github.token }}
          ARGS: ${{ inputs.all && '--all' || '' }}
        shell: bash
        run: |
          set +e   # 한 번 실패(포털·네트워크 오류)해도 멈추지 않고 다음 확인 때 다시
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sync() { git pull -q --rebase || { git rebase --abort 2>/dev/null; git reset -q --hard "@{u}"; }; }
          handoff=$((SECONDS + 330 * 60))   # 5시간 30분 뒤 다음 실행으로 넘김
          while :; do
            now=$(TZ=Asia/Seoul date +%Y%m%d%H%M)
            if [ "$now" -ge 202611072200 ]; then echo "대회 끝 — 멈춤"; exit 0; fi
            hour=$((10#${now:8:2}))
            if [ "$hour" -ge 7 ] && [ "$hour" -lt 22 ]; then   # 한국 시간 07~21시에만 확인
              sync
              if python update_results.py $ARGS; then ARGS=""; fi
              git add official.json
              git diff --cached --quiet || git commit -q -m "공식 결과 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
              if [ "$(git rev-list --count "@{u}..HEAD")" != 0 ]; then
                sync; git push -q || echo "푸시 실패 — 다음 확인 때 다시"
              fi
            fi
            if [ "$SECONDS" -ge "$handoff" ]; then
              gh workflow run results.yml --ref "$GITHUB_REF_NAME" -f handoff=true && echo "다음 실행으로 넘김" && exit 0
              echo "다음 실행 띄우기 실패 — 예약 실행이 다시 이어 줌"; exit 1
            fi
            sleep 300
          done
